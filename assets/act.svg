<style>

.fall{animation-timing-function:linear;animation-iteration-count:infinite}
.s1{animation-name:fall1}.s2{animation-name:fall2}.s3{animation-name:fall3}
@keyframes fall1{0%{transform:translate(0,-30px)}50%{transform:translate(-60px,210px)}100%{transform:translate(-20px,450px)}}
@keyframes fall2{0%{transform:translate(0,-30px)}50%{transform:translate(70px,210px)}100%{transform:translate(140px,450px)}}
@keyframes fall3{0%{transform:translate(0,-30px)}33%{transform:translate(40px,140px)}66%{transform:translate(-30px,280px)}100%{transform:translate(60px,450px)}}
.spin{animation-name:spin;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;transform-box:fill-box;transform-origin:center}
@keyframes spin{0%{transform:rotate(-40deg) scaleX(1)}50%{transform:rotate(80deg) scaleX(.35)}100%{transform:rotate(200deg) scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.kb{animation:kb 22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 30%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-10px,6px)}}
.row{opacity:0;animation:rowIn 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.4}}
.draw{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 2.4s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.row{opacity:1}.draw{stroke-dashoffset:0}}
</style>
